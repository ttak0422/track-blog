name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  TRACK_REF: 1feb928a5fb985ad06343e72612afe022ff4b308

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog vault
        uses: actions/checkout@v4

      - name: Checkout track engine
        uses: actions/checkout@v4
        with:
          repository: ttak0422/track
          ref: ${{ env.TRACK_REF }}
          path: .track-engine
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build static site
        run: make site

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy production site
        run: vercel deploy deploy --prod --yes --token "$VERCEL_TOKEN"
